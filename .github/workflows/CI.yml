name: 编译rtty
on:
  schedule:
    - cron: '0 3,20 * * *'
  workflow_dispatch:
  
env:
  TZ: Asia/Shanghai
permissions:
  contents: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.getversion.outputs.ver }}
      cver: ${{ steps.getversion.outputs.cver }}
    steps:
      - name: 检查更新
        id: getversion
        run: |
          ver=`curl https://api.github.com/repos/zhaojh329/rtty/releases/latest | jq -r '.tag_name'`
          cver=`curl https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name'`
          echo "ver=${ver}" >> $GITHUB_OUTPUT
          echo "cver=${cver}" >> $GITHUB_OUTPUT
      - name: delete-workflow
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0
  build:
    needs: check
    if: ${{ needs.check.outputs.ver != needs.check.outputs.cver }}
    name: rtty_${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: aarch64-linux-musl
          URL: aarch64-linux-musl
          ARCH_FLAG: linux-aarch64
        - target: aarch64-linux-musl
          URL: aarch64-linux-musl
          
        - target: x86_64-linux-musl
          URL: x86_64-linux-musl
          ARCH_FLAG: linux-x86_64
        - target: x86_64-linux-musl
          URL: x86_64-linux-musl
            
        - target: i686-linux-musl
          URL: i686-linux-musl
          ARCH_FLAG: linux-generic32
        - target: i686-linux-musl
          URL: i686-linux-musl
        
        - target: armv7-linux-musleabihf
          URL: armv7l-linux-musleabihf
          ARCH_FLAG: linux-armv4
        - target: armv7-linux-musleabihf
          URL: armv7l-linux-musleabihf

        - target: armv7-linux-musleabi
          URL: armv7m-linux-musleabi
          ARCH_FLAG: linux-armv4
        - target: armv7-linux-musleabi
          URL: armv7m-linux-musleabi
          
        - target: arm-linux-musleabihf
          URL: arm-linux-musleabihf
          ARCH_FLAG: linux-armv4
        - target: arm-linux-musleabihf
          URL: arm-linux-musleabihf

        - target: arm-linux-musleabi
          URL: arm-linux-musleabi
          ARCH_FLAG: linux-armv4
        - target: arm-linux-musleabi
          URL: arm-linux-musleabi

        - target: mipsel-linux-musl
          URL: mipsel-linux-muslsf
          ARCH_FLAG: linux-mips32
        - target: mipsel-linux-musl
          URL: mipsel-linux-muslsf

        - target: mips-linux-musl
          URL: mips-linux-muslsf
          ARCH_FLAG: linux-mips32
        - target: mips-linux-musl
          URL: mips-linux-muslsf
    env:
      TARGET: ${{ matrix.target }}
      URL: ${{ matrix.URL }}
      OPENSSL_TARGET: ${{ matrix.ARCH_FLAG }}
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4
       with:
        repository: zhaojh329/rtty
        ref: ${{ needs.check.outputs.ver }}
        submodules: 'true'
     - name: 下载linux-musl-gcc
       uses: lmq8267/dl-musl@main
       with:
        target: ${{ matrix.URL }}
        static: true
        gccpath: /tmp
     - name: 缓存 zlib
       id: cache-zlib
       uses: actions/cache@v4
       with:
        path: |
          /opt/zlib-${{ matrix.target }}
        key: zlib-${{ matrix.target }}-cache
     - name: 缓存 OpenSSL 
       id: cache-openssl
       uses: actions/cache@v4
       with:
        path: /opt/openssl-${{ env.TARGET }}
        key: openssl-${{ env.TARGET }}-cache
     - name: 缓存 libev
       id: cache-libev
       uses: actions/cache@v4
       with:
        path: /opt/libev-${{ matrix.target }}
        key: libev-${{ matrix.target }}-cache
     - name: 缓存 libinih
       id: cache-inih
       uses: actions/cache@v4
       with:
        path: /opt/inih-${{ matrix.target }}
        key: inih-${{ matrix.target }}-cache
     - name: 安装 UPX
       uses: crazy-max/ghaction-upx@v3
       with:
        version: v4.2.4
        install-only: true
     - name: 编译
       run: |
         echo "tag=${{ needs.check.outputs.ver }}" >> $GITHUB_ENV
         export CFLAGS="-ffunction-sections -fdata-sections -O2 -w $CFLAGS -I/opt/zlib-${TARGET}/include -I/opt/openssl-${TARGET}/include -I/opt/libev-${TARGET}/include -I/opt/inih-${TARGET}/include"
         export LDFLAGS="-s $LDFLAGS -Wl,--gc-sections -L/opt/zlib-${TARGET}/lib -I/opt/openssl-${TARGET}/lib -L/opt/libev-${TARGET}/lib -L/opt/inih-${TARGET}/lib" 
         if [ ! -d "/opt/openssl-${{ env.TARGET }}" ] && [ ! -z "${{ env.OPENSSL_TARGET }}" ] ; then
           if [ ! -d "/opt/zlib-${TARGET}" ] || [ -z "$(find /opt/zlib-${TARGET}/lib -name '*.a' 2>/dev/null)" ] ; then
              #使用zlib-1.3.2版本
              wget https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
              tar xf zlib-1.3.2.tar.gz
              cd zlib-1.3.2
              echo "###########################编译zlib依赖库########################"
              ./configure --static --prefix=/opt/zlib-${TARGET}
              make -j$(nproc)
              make install
              cd ../
           fi
            #克隆openssl
            git clone --recursive https://github.com/openssl/openssl -b OpenSSL_1_1_1-stable
            cd openssl
            echo "###########################编译openssl依赖库########################"
            ./Configure no-shared --prefix=/opt/openssl-${{ env.TARGET }} ${{ env.OPENSSL_TARGET }}
            make -j$(nproc)
            make install
            cd ../
         fi
         if [ ! -d "/opt/libev-${TARGET}" ] || [ -z "$(find /opt/libev-${TARGET}/lib -name '*.a' 2>/dev/null)" ]; then
            echo "###########################编译libev依赖库########################"
            wget -q http://dist.schmorp.de/libev/libev-4.33.tar.gz -O libev-4.33.tar.gz
            tar xf libev-4.33.tar.gz
            cd libev-4.33
            ./configure --disable-shared --enable-static --prefix=/opt/libev-${TARGET} --host=${TARGET}
            make -j$(nproc)
            make install
            cd ..
         fi
         if [ ! -d "/opt/inih-${TARGET}" ] || [ -z "$(find /opt/inih-${TARGET}/lib -name '*.a' 2>/dev/null)" ]; then
            echo "###########################编译libinih依赖库########################"
            wget -q "https://github.com/benhoyt/inih/archive/refs/tags/r62.tar.gz" -O inih-r62.tar.gz
            tar xf inih-r62.tar.gz
            cd inih-r62
            # 直接手动编译静态库，无需 meson，适合嵌入式交叉编译
            ${CC} -c -O2 -fPIC \
              -ffunction-sections -fdata-sections \
              ini.c -o ini.o
            ${AR} rcs libinih.a ini.o
            # 安装
            mkdir -p /opt/inih-${TARGET}/include /opt/inih-${TARGET}/lib
            cp ini.h /opt/inih-${TARGET}/include/
            cp libinih.a /opt/inih-${TARGET}/lib/
            mkdir -p /opt/inih-${TARGET}/include /opt/inih-${TARGET}/lib/pkgconfig
            cp ini.h /opt/inih-${TARGET}/include/
            cp libinih.a /opt/inih-${TARGET}/lib/
            echo "prefix=/opt/inih-${TARGET}"                    > /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "exec_prefix=\${prefix}"                       >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "libdir=\${exec_prefix}/lib"                   >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "includedir=\${prefix}/include"                >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo ""                                             >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "Name: inih"                                   >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "Description: Simple INI file parser"         >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "Version: 62"                                  >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "Libs: -L\${libdir} -linih"                   >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            echo "Cflags: -I\${includedir}"                    >> /opt/inih-${TARGET}/lib/pkgconfig/inih.pc
            cd ../
         fi
         echo "###########################编译RTTY########################"
         mkdir -p bin && cd bin
         if [ -n "${{ env.OPENSSL_TARGET }}" ]; then
         PKG_CONFIG_PATH="/opt/inih-${TARGET}/lib/pkgconfig:${PKG_CONFIG_PATH}" \
         cmake .. \
          -DCMAKE_INSTALL_PREFIX=. \
          -DUSE_OPENSSL=ON \
          -DLIBEV_INCLUDE_DIR=/opt/libev-${TARGET}/include \
          -DLIBEV_LIBRARY=/opt/libev-${TARGET}/lib/libev.a \
          -DOPENSSL_FOUND=TRUE \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENSSL_INCLUDE_DIR=/opt/openssl-${TARGET}/include \
          -DOPENSSL_INCLUDE_DIRS="/opt/openssl-${TARGET}/include" \
          -DOPENSSL_LIBRARIES="/opt/openssl-${TARGET}/lib/libssl.a;/opt/openssl-${TARGET}/lib/libcrypto.a" \
          -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--gc-sections -s"
         else
         PKG_CONFIG_PATH="/opt/inih-${TARGET}/lib/pkgconfig:${PKG_CONFIG_PATH}" \
         cmake .. \
          -DCMAKE_INSTALL_PREFIX=. \
          -DSSL_SUPPORT=OFF \
          -DLIBEV_INCLUDE_DIR=/opt/libev-${TARGET}/include \
          -DLIBEV_LIBRARY=/opt/libev-${TARGET}/lib/libev.a \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--gc-sections -s"
         fi
         make -j$(nproc)
         make install
         cd bin
         $STRIP rtty
         file rtty
         upx --lzma --best rtty
         if [ -n "${{ env.OPENSSL_TARGET }}" ]; then
            mv rtty rtty-${TARGET}-ssl
         else
            mv rtty rtty-${TARGET}
         fi
         echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
         
     - uses: actions/upload-artifact@v4
       with:
        name: rtty-${{ matrix.target }}${{ matrix.ARCH_FLAG != '' && '-ssl' || '' }}
        path: bin/bin/
        
     - name: 发布Release
       uses: softprops/action-gh-release@v2
       with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
           > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ needs.check.outputs.ver }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github) 

           带 **`ssl`** 后缀的表示集成`openssl`，支持`https`
            
            [官方更新说明](https://github.com/zhaojh329/rtty/releases)
            
            [服务端程序下载](https://github.com/lmq8267/rttys/releases)
           
          tag_name: ${{ needs.check.outputs.ver }}
          files: bin/bin/*

  keepalive-workflow:
    # github超过60天未提交将自动停止工作流
    name: 工作流保活 
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 检查上次提交日期
        id: check_commit_date
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%cd --date=short)
          echo "上次提交日期: $LAST_COMMIT_DATE"
          LAST_COMMIT_TIMESTAMP=$(date -d "$LAST_COMMIT_DATE" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_TIMESTAMP - LAST_COMMIT_TIMESTAMP) / 86400 ))
          echo "距离上次提交以来的天数: $DIFF_DAYS"
          echo "diff_days=$DIFF_DAYS" >> $GITHUB_ENV
      - name: 执行空提交
        if: ${{ env.diff_days > 50 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "自动空提交，保持仓库活跃"
          git push
